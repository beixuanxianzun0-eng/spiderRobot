# 每帧时间与腿部几何参数，时间单位为秒，长度单位为米。
frame_duration=0.0166666667
base_body_height=0.275
middle_leg_length=0.22
distal_leg_length=0.20

# 第二关节初始角、动作限制和速度，角度单位为弧度。
initial_leg_bend_angle=0.6
minimum_leg_bend_angle=-1.5
maximum_leg_bend_angle=1.5
leg_bend_speed=0.8

# 身体升降关节的 PD 控制参数。
body_pd_proportional_gain=60.0
body_pd_derivative_gain=8.0
body_pd_maximum_effort=30.0

# 六条腿共用的 PD 控制参数。
leg_pd_proportional_gain=8.0
leg_pd_derivative_gain=0.8
leg_pd_maximum_effort=3.0
