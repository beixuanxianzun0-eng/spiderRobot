# ==================== 仿真时间参数 ====================

# 单帧目标时长，决定控制和显示刷新间隔，单位为秒；有效范围：(0, +∞)。
frame_duration=0.0166666667

# ==================== 身体与腿部尺寸参数 ====================

# 身体中心的初始离地高度，单位为米；建议范围：[0, +∞)，当前代码未设置硬上限。
initial_body_height=0.120

# 腿部第二段的长度，参与高度和角度计算，单位为米；有效范围：(0, +∞)。
middle_leg_length=0.07

# 腿部第三段的长度，参与高度和角度计算，单位为米；有效范围：[0, +∞)。
distal_leg_length=0.13

# ==================== 身体与腿部质量参数 ====================

# 蜘蛛身体的质量，单位为千克；有效范围：(0, +∞)。
spider_body_mass=0.8

# 每条腿根部段的质量，六条腿共用，单位为千克；有效范围：(0, +∞)。
leg_root_mass=0.01

# 每条腿中间段的质量，六条腿共用，单位为千克；有效范围：(0, +∞)。
leg_middle_mass=0.01

# 每条腿末端段的质量，六条腿共用，单位为千克；有效范围：(0, +∞)。
leg_distal_mass=0.01

# ==================== 关节初始角度与限制参数 ====================

# 第二关节的初始弯曲角度，单位为弧度；有效范围：[minimum_leg_bend_angle, maximum_leg_bend_angle]。
initial_leg_bend_angle=0.294915656

# 第二关节允许的最小角度，单位为弧度；有效范围：[-1.570796327, maximum_leg_bend_angle]。
minimum_leg_bend_angle=-1.5

# 第二关节允许的最大角度，单位为弧度；有效范围：[minimum_leg_bend_angle, 1.570796327]。
maximum_leg_bend_angle=1.5

# 第三关节的初始弯曲角度，单位为弧度；有效范围：[minimum_distal_leg_angle, maximum_distal_leg_angle]。
initial_distal_leg_angle=-1.765373443

# 第三关节允许的最小角度，单位为弧度；有效范围：(-∞, maximum_distal_leg_angle]。
minimum_distal_leg_angle=-3.141592654

# 第三关节允许的最大角度，单位为弧度；有效范围：[minimum_distal_leg_angle, +∞)。
maximum_distal_leg_angle=0.0

# ==================== 手动弯腿控制参数 ====================

# 按住 Q/E 时第二关节每秒改变的角度，单位为弧度/秒；有效范围：(0, +∞)。
leg_bend_speed=2

# ==================== 行走步态参数 ====================

# 完成一次交替三角步态所需时间，单位为秒；有效范围：(0, +∞)。
gait_cycle_duration=1

# 根部关节前后摆动的绝对角度限制，单位为弧度；有效范围：(0, +∞)。
gait_root_joint_limit=3

# 每一步的前后摆动幅度，数值越大跨度越大，单位为弧度；有效范围：[0, gait_root_joint_limit]，超出时自动取上限。
gait_stride_angle=2

# 抬腿时第二关节额外减少的角度，数值越大抬腿越高，单位为弧度；有效范围：[0, initial_leg_bend_angle - minimum_leg_bend_angle]，超出时自动取上限。
gait_lift_angle=0.70

# ==================== 关节 PD 控制参数 ====================

# PD 控制的位置误差增益，数值越大关节追赶目标越强；建议范围：[0, +∞)，当前代码未设置硬上限。
leg_pd_proportional_gain=4.0

# PD 控制的速度阻尼增益，数值越大越能抑制关节振荡；建议范围：[0, +∞)，当前代码未设置硬上限。
leg_pd_derivative_gain=0.7

# 单个电机允许输出的最大控制力绝对值；有效范围：[0, +∞)，当前代码未设置硬上限。
leg_pd_maximum_effort=0.20
